<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TeeTime</title>
<meta name="description" content="Boka starttider, bevaka fulla tider och bjud in golfvänner.">
<meta name="theme-color" content="#F6F7F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1712" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TeeTime">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: mobilapp i en kolumn. Flikmeny längst ned, åtgärdsfält ovanför, startlista som rader med en boll per plats. */
:root {
  --bg: #F6F7F2; --surface: #FFFFFF; --ink: #0E1B14; --muted: #56655B; --line: #DCE2D9; --hair: #EEF1EC;
  --green: #1F6B43; --green-ink: #164F31; --on-green: #FFFFFF; --tint: #E4EFE6;
  --free: #1F6B43; --few: #B9862B; --full: #B4483C; --flag: #F2C230; --on-flag: #2A2200; --dusk: #4B4E8C;
  --night: #0E1B14; --on-night: #F6F7F2;
  --shadow: 0 1px 2px rgba(14,27,20,.08);
  --font-display: "Familjen Grotesk", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1712; --surface: #14211A; --ink: #E8EFE9; --muted: #9AAB9F; --line: #24362B; --hair: #1B2B22;
    --green: #5FC08A; --green-ink: #8ED6AD; --on-green: #08130D; --tint: #1B3024; --free: #5FC08A; --few: #E0B24A; --full: #E37B6E; --dusk: #A2A6EC;
    --night: #050B08; --on-night: #E8EFE9;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1712; --surface: #14211A; --ink: #E8EFE9; --muted: #9AAB9F; --line: #24362B; --hair: #1B2B22;
  --green: #5FC08A; --green-ink: #8ED6AD; --on-green: #08130D; --tint: #1B3024; --free: #5FC08A; --few: #E0B24A; --full: #E37B6E; --dusk: #A2A6EC;
  --night: #050B08; --on-night: #E8EFE9;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
:root.big { font-size: 112.5%; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 0.95rem; line-height: 1.45; padding-inline: 16px; padding-top: env(safe-area-inset-top, 0px); -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--green); }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 720px; margin-inline: auto; padding-block: 14px calc(var(--nav-h) + 150px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; letter-spacing: -0.02em; }
.brand svg { width: 28px; height: 28px; flex: none; }
.iconbtn { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; width: 44px; height: 44px; display: grid; place-items: center; }
.iconbtn svg { width: 22px; height: 22px; }
h1, h2 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.2rem; }
h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 4px 0 0; font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.note { font-size: .85rem; color: var(--muted); margin: 0; }
p { margin: 0; }
label, .lbl { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
input[type=date], input[type=time], input[type=text], input[type=number], input[type=email], input[type=password], input[type=search], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
textarea { resize: vertical; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.form2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form2 .wide { grid-column: 1 / -1; }

.status { font-size: .8rem; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--tint); color: var(--muted); align-self: flex-start; }
.status.off { background: color-mix(in srgb, var(--full) 18%, var(--surface)); color: var(--ink); }

.clubbtn { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; border: 0; background: transparent; padding: 0; }
.clubbtn b { font-family: var(--font-display); font-size: 1.25rem; display: block; }
.clubbtn span.note { display: block; }
.clubbtn .chev { color: var(--green); font-weight: 700; font-size: .9rem; white-space: nowrap; }

.strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.strip::-webkit-scrollbar { display: none; }
.day { flex: none; width: 54px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 7px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.day .w { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.day .n { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; line-height: 1.1; }
.day.we .w { color: var(--green); }
.day[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--on-green); }
.day[aria-pressed="true"] .w { color: var(--on-green); opacity: .85; }
.day.other { width: auto; padding-inline: 12px; justify-content: center; font-size: .82rem; font-weight: 600; position: relative; }
.day.other input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

.courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.course { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.course b { font-size: .95rem; }
.course small { color: var(--muted); font-size: .78rem; }
.course .p { font-family: var(--font-mono); font-size: .8rem; margin-top: 2px; }
.course[aria-pressed="true"] { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); background: var(--tint); }

.stepper { display: flex; align-items: center; justify-content: space-between; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; min-height: 44px; padding: 3px; gap: 6px; }
.stepper button { width: 38px; height: 38px; border-radius: 8px; background: var(--surface); font-size: 1.25rem; line-height: 1; border: 1px solid var(--line); }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper output { font-family: var(--font-mono); font-size: 1.05rem; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .82rem; font-weight: 600; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.sun { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.sun b { font-family: var(--font-mono); font-weight: 500; color: var(--ink); }
.legend { display: flex; gap: 12px; font-size: .75rem; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 7px; }
.slot { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 6px 7px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.slot .t { font-family: var(--font-mono); font-size: .95rem; }
.slot .bars { display: flex; gap: 2px; width: 100%; }
.slot .bars b { height: 5px; flex: 1; border-radius: 2px; background: var(--line); }
.slot.ok .bars b.f { background: var(--free); }
.slot.few .bars b.f { background: var(--few); }
.slot.full .t, .slot.past .t, .slot.blocked .t { color: var(--muted); }
.slot.full .t { text-decoration: line-through; text-decoration-thickness: 1px; }
.slot.full .bars b { background: var(--full); opacity: .55; }
.slot.past { opacity: .4; }
.slot.blocked { background: repeating-linear-gradient(135deg, var(--surface) 0 6px, var(--tint) 6px 12px); }
.slot.blocked .bars { visibility: hidden; }
.slot .mk { position: absolute; top: 4px; right: 5px; display: flex; gap: 3px; }
.slot .mk i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.slot .mk i.dusk { background: var(--dusk); }
.slot .mk i.open { background: var(--flag); }
.slot .mk i.watch { background: transparent; border: 1.5px solid var(--ink); }
.slot .mk i.mine { background: var(--green); }
.slot[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); }
.slot[aria-pressed="true"] .t { color: var(--bg); text-decoration: none; }
.slot[aria-pressed="true"] .mk i.watch { border-color: var(--bg); }
.slot[aria-pressed="true"] .bars b { opacity: 1; }
.info { border-radius: 10px; background: var(--tint); padding: 10px 12px; font-size: .9rem; }
.info.warn { background: color-mix(in srgb, var(--full) 14%, var(--surface)); }
.info.dusk { background: color-mix(in srgb, var(--dusk) 14%, var(--surface)); }
.info.flag { background: color-mix(in srgb, var(--flag) 30%, var(--surface)); }
.skeleton { height: 120px; border-radius: 10px; background: linear-gradient(90deg, var(--tint), var(--surface), var(--tint)); background-size: 200% 100%; animation: sh 1.2s infinite linear; }
@keyframes sh { to { background-position: -200% 0; } }

.actionbar { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px; z-index: 5; }
.actionbar .in { max-width: 720px; margin-inline: auto; display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.actionbar .sum { min-width: 0; flex: 1 1 170px; }
.actionbar .sum strong { display: block; font-family: var(--font-display); font-size: 1.05rem; }
.actionbar .sum span { font-size: .8rem; color: var(--muted); }
nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 6; }
nav.bottom .in { max-width: 720px; margin-inline: auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; height: var(--nav-h); }
nav.bottom button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: .7rem; font-weight: 600; color: var(--muted); position: relative; min-width: 0; }
nav.bottom button svg { width: 22px; height: 22px; }
nav.bottom button[aria-selected="true"] { color: var(--green); }
.badge { position: absolute; top: 6px; left: calc(50% + 6px); background: var(--flag); color: var(--on-flag); font-size: .68rem; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding-inline: 4px; }
.badge.quiet { background: var(--tint); color: var(--muted); }
.iconbtn .badge { top: -6px; left: auto; right: -6px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; font-weight: 600; min-height: 44px; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--green); border-color: var(--green); color: var(--on-green); }
.btn.warn { color: var(--full); border-color: var(--full); }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: .88rem; }
.btn.block { width: 100%; }
.btn.link { border: 0; background: transparent; color: var(--green); padding-inline: 4px; min-height: 0; }
.btn:disabled { opacity: .5; cursor: default; }

.list { display: flex; flex-direction: column; gap: 10px; }
.item { display: grid; grid-template-columns: auto 1fr; gap: 12px 14px; align-items: center; }
.item .when { text-align: center; border-right: 1px solid var(--line); padding-right: 14px; min-width: 62px; }
.item .when .d { font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; line-height: 1.05; }
.item .when .m { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.item .what { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .what .time { font-family: var(--font-mono); font-size: 1.1rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.item .what .meta { color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; }
.item .btns { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.item.ready { border-color: var(--flag); box-shadow: inset 4px 0 0 var(--flag); }
.chip { display: inline-block; font-family: var(--font-body); font-size: .72rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--tint); color: var(--muted); letter-spacing: .02em; }
.chip.ready, .chip.yes { background: var(--flag); color: var(--on-flag); }
.chip.no { background: color-mix(in srgb, var(--full) 18%, var(--surface)); color: var(--ink); }
.chip.code { font-family: var(--font-mono); font-weight: 500; }
.empty { text-align: center; color: var(--muted); padding: 22px 12px; }
.empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 1.05rem; margin-bottom: 4px; }
.banner { background: var(--flag); color: var(--on-flag); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-weight: 600; }
.banner button { background: var(--on-flag); color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--tint); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat .v { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat .k { font-size: .75rem; color: var(--muted); }
.hist { display: flex; flex-direction: column; }
.hist div { display: grid; grid-template-columns: 7.5em 3.5em 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: .88rem; }
.hist div:first-child { border-top: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--green); flex: none; }
.toggle span { font-size: .9rem; }
.person { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.person:first-child { border-top: 0; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--tint); color: var(--green); display: grid; place-items: center; font-weight: 700; flex: none; }
.person .grow b { display: block; }
.code-big { font-family: var(--font-mono); font-size: 1.6rem; letter-spacing: .1em; }
.notif { display: grid; grid-template-columns: 10px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); text-align: left; background: transparent; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.notif:first-child { border-top: 0; }
.notif .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--flag); margin-top: 7px; }
.notif.read .dot { background: transparent; }
.notif b { display: block; }
.notif small { color: var(--muted); }
.bars-h { display: flex; flex-direction: column; gap: 8px; }
.bars-h .r { display: grid; grid-template-columns: 8.5em 1fr 4.5em; gap: 10px; align-items: center; font-size: .88rem; }
.bars-h .track { height: 10px; background: var(--tint); border-radius: 5px; overflow: hidden; }
.bars-h .fill { display: block; height: 100%; background: var(--green); border-radius: 5px; }
.bars-h .n { font-family: var(--font-mono); font-size: .8rem; text-align: right; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; min-width: 480px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.menu { display: flex; flex-direction: column; }
.menu button { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 2px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; font-weight: 600; }
.menu button:first-child { border-top: 0; }
.menu button span.note { font-weight: 400; }

.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(8,18,12,.45); display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet-card { background: var(--surface); color: var(--ink); border-radius: 18px; width: 100%; max-width: 520px; max-height: calc(100% - 20px); overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
@media (min-width: 640px) { .sheet { align-items: center; } }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .9rem; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; }
.total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); padding-top: 10px; }
.total b { font-family: var(--font-display); font-size: 1.4rem; }
.bigcode { font-family: var(--font-mono); font-size: 1.75rem; letter-spacing: .08em; text-align: center; padding: 10px; background: var(--tint); border-radius: 12px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--tint); padding: 4px; border-radius: 10px; }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 8px 4px; font-size: .82rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.clublist { display: flex; flex-direction: column; max-height: 55vh; overflow-y: auto; overscroll-behavior: contain; }

/* Startlista: en rad per starttid, en boll per plats */
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.sl { display: flex; flex-direction: column; margin-inline: -16px; border-top: 1px solid var(--line); }
.sl-row { display: grid; grid-template-columns: 3.6rem auto minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 54px; padding: 6px 16px; border: 0; border-bottom: 1px solid var(--hair); background: var(--surface); color: var(--ink); text-align: left; width: 100%; }
.sl-row .t { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.sl-row .balls { display: flex; gap: 5px; }
.sl-row .balls i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--free); box-sizing: border-box; display: block; }
.sl-row .balls i.f { background: var(--free); }
.sl-row.few .balls i { border-color: var(--few); } .sl-row.few .balls i.f { background: var(--few); }
.sl-row.full .balls i { border-color: var(--full); background: var(--full); opacity: .55; }
.sl-row.full { color: var(--muted); }
.sl-row .st { display: flex; flex-direction: column; min-width: 0; }
.sl-row .st b { font-size: .92rem; font-weight: 600; }
.sl-row .st span { font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sl-row .pr { font-family: var(--font-mono); font-size: .82rem; font-variant-numeric: tabular-nums; }
.sl-row.past { opacity: .4; }
.sl-row.blocked { background: repeating-linear-gradient(135deg, var(--surface) 0 7px, var(--hair) 7px 14px); color: var(--muted); }
.sl-row.blocked .balls i, .sl-row.blocked .balls i.f { border-color: var(--line); background: transparent; opacity: 1; }

/* ================= Direktuppdatering ================= */
function subscribeMain() {
  if (chMain) sb.removeChannel(chMain);
  chMain = sb.channel('tt-' + S.uid)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'notifications', filter: 'user_id=eq.' + S.uid }, function (p) {
      if (p.eventType === 'INSERT') {
        var n = p.new; S.notifs.unshift(n); renderBell(); toast(n.title);
        if (/^(proposal|friend)/.test(n.kind)) { loadFriends().then(loadProposals).then(function () { renderFriends(); saveCache(); }); }
        if (/proposal_booked|cancelled|round_cancelled/.test(n.kind)) loadRounds().then(function () { renderMine(); saveCache(); });
      }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'watches', filter: 'user_id=eq.' + S.uid }, function () { loadWatches().then(function () { renderWatch(); renderBoka(); saveCache(); }); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'friendships' }, function () { loadFriends().then(function () { renderFriends(); saveCache(); }); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'proposal_members' }, function () { loadProposals().then(function () { renderFriends(); saveCache(); }); })
    .subscribe();
}
function subscribeSheet() {
  var ids = bookablePicks(), key = ids.join(',');
  if (chSheet && chSheet._key === key) return;
  if (chSheet) { sb.removeChannel(chSheet); chSheet = null; }
  if (!ids.length) return;
  chSheet = sb.channel('sheet-' + key.slice(0, 120)).on('postgres_changes', { event: '*', schema: 'public', table: 'sheet_events', filter: ids.length === 1 ? 'club_id=eq.' + ids[0] : 'club_id=in.(' + key + ')' }, function (p) {
    var d = (p.new && p.new.play_date) || (p.old && p.old.play_date);

    loadRounds().then(function () { renderMine(); });

/* ================= Notiser i telefonen ================= */
function b64ToU8(s) { var p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
async function enablePush(quiet) {
  var ps = pushState();
  if (ps === 'unsupported') { if (!quiet) toast(isIOS() && !isStandalone() ? 'Lägg till appen på hemskärmen först, öppna den därifrån och försök igen.' : 'Notiser stöds inte i den här webbläsaren.'); return false; }
  try {
    var perm = await Notification.requestPermission();
    if (perm !== 'granted') { if (!quiet) toast('Notiser är inte tillåtna. Ändra det i telefonens inställningar.'); renderMer(); return false; }
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID_PUBLIC) });
    var j = sub.toJSON();
    var r = await sb.from('push_subscriptions').insert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_agent: navigator.userAgent.slice(0, 200) });
    if (r.error && r.error.code !== '23505') throw r.error;
    lsSet('tt-push-' + S.uid, '1');
    if (!quiet) toast('Notiser är påslagna');
    renderMer(); renderWatch();
    return true;
  } catch (e) { if (!quiet) toast('Det gick inte att slå på notiser. ' + errMsg(e)); return false; }
}
async function disablePush() {
  try {
    var reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if (sub) { await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
  } catch (e) {}
  lsDel('tt-push-' + S.uid); toast('Notiser i telefonen är avstängda'); renderMer(); renderWatch();
}

  Array.prototype.forEach.call(document.querySelectorAll('#tabs [data-tab]'), function (b) { b.setAttribute('aria-selected', b.dataset.tab === t); });

  closeSheet();

    if (S.picks.indexOf(d.club_id) < 0) { S.picks.push(d.club_id); savePicks(); }
    S.club = d.club_id; S.date = d.date; S.time = d.time; S.course = d.course_id || 'any'; S.scrollToSel = true;
    setTab('boka'); subscribeSheet(); loadSheet(true).then(function () { selectSlot(d.club_id, d.time); renderBoka(); });
  } else if (/^(proposal|friend)/.test(n.kind)) setTab('vanner');
  else setTab('mina');

async function findFree() {
  var ids = bookablePicks(); if (!ids.length) return;
  toast('Letar efter närmaste lediga tid på dina banor…');
  var target = toMin(S.time);
  for (var i = 0; i < 10; i++) {
    var d = addDays(S.date, i); if (d < today()) continue;
    var res = await Promise.all(ids.map(function (cid) { return sb.rpc('get_day_sheet', { p_club: cid, p_date: d }); }));
    var best = null;
    res.forEach(function (r, k) {
      if (r.error) return;
      (r.data || []).forEach(function (x) {
        var t = hm(x.tee_time);
        if (ids.length === 1 && S.course !== 'any' && x.course_id !== S.course) return;
        if (x.blocked || x.free < S.players || isPast(d, t)) return;
        if (!best || Math.abs(toMin(t) - target) < Math.abs(toMin(best.t) - target)) best = { t: t, club: ids[k] };
      });
    });
    if (best) { S.date = d; S.sheet = null; S.time = best.t; S.club = best.club; S.scrollToSel = true; await loadSheet(true); selectSlot(best.club, best.t); renderBoka(); toast('Närmaste lediga: ' + fmtDate(d) + ' kl ' + best.t + ', ' + shortName(club(best.club))); return; }
  }
  toast('Ingen ledig tid de närmaste tio dagarna. Bevaka i stället eller lägg till fler banor.');
}

async function copyText(txt, okMsg) {
  if (navigator.share) { try { await navigator.share({ text: txt }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(txt); toast(okMsg || 'Kopierat'); }
  catch (e) { openSheet('<h2 id="sheetH">Kopiera</h2><textarea id="copyArea" rows="4">' + esc(txt) + '</textarea><button type="button" class="btn primary" data-act="close">Klar</button>'); var a = $('copyArea'); if (a) { a.focus(); a.select(); } }
}
function needOnline() { if (!S.online) { toast('Ingen anslutning. Försök igen när du har nät.'); return false; } return true; }

async function onAction(e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var act = el.dataset.act, id = el.dataset.id;
  try {
    switch (act) {
      case 'close': closeSheet(); break;
      case 'goto': closeSheet(); setTab(el.dataset.tab); break;
      case 'done': closeSheet(); setTab('mina'); break;
      case 'pick-club': case 'open-picker': openClubPicker(); break;
      case 'toggle-pick': {
        var pi = S.picks.indexOf(id);
        if (pi >= 0) S.picks.splice(pi, 1); else { if (S.picks.length >= 10) { toast('Du kan välja högst tio banor åt gången.'); return; } S.picks.push(id); }
        savePicks(); refreshPicker();
        if ($('sheet').hidden) renderBoka();
        break;
      }
      case 'remove-pick': {
        S.picks = S.picks.filter(function (x) { return x !== id; }); savePicks();
        if (S.club === id) { S.club = bookablePicks()[0] || null; S.course = 'any'; }
        S.sheet = null; S.sheetKey = ''; renderBoka(); subscribeSheet(); loadSheet(true);
        break;
      }
      case 'picks-done': {
        if (!S.picks.length) { toast('Välj minst en bana.'); return; }
        closeSheet(); setTab('boka');
        if (S.picks.indexOf(S.club) < 0 || !clubBookable(S.club)) S.club = bookablePicks()[0] || S.picks[0];
        if (bookablePicks().length !== 1) S.course = 'any';
        S.sheet = null; S.sheetKey = ''; S.scrollToSel = true; if (bookablePicks().length > 1) S.onlyFree = true;
        renderBoka(); subscribeSheet(); loadSheet(true);
        break;
      }
      case 'set-club': if (S.picks.indexOf(id) < 0) S.picks.push(id); savePicks(); S.club = id; S.course = 'any'; S.sheet = null; S.sheetKey = ''; S.scrollToSel = true; closeSheet(); setTab('boka'); renderBoka(); subscribeSheet(); loadSheet(true); break;
      case 'fav-club': {
        if (!needOnline()) return;
        var favs = (S.settings.favorite_clubs || []).slice(), ix = favs.indexOf(id);
        if (ix >= 0) favs.splice(ix, 1); else favs.unshift(id);
        favs = favs.slice(0, 30);
        var fr0 = await sb.from('settings').update({ favorite_clubs: favs }).eq('user_id', S.uid);
        if (fr0.error) { toast(errMsg(fr0.error)); return; }
        S.settings.favorite_clubs = favs; saveCache();
        toast(ix >= 0 ? 'Borttagen från favoriter' : 'Sparad som favorit');
        if ($('clubList')) $('clubList').innerHTML = clubListHtml();
        renderBoka();
        break;
      }
      case 'tip-club': {
        var tc = club(id); if (!tc) return;
        copyText('Hej ' + tc.name + '! Jag använder TeeTime för att boka golf, bevaka fulla tider och bjuda in vänner. Det vore toppen om ni anslöt er, så att jag kan boka era tider där. ' + APP_URL, 'Texten är kopierad. Skicka den till klubben.');
        break;
      }
      case 'club-near': {
        if (S.geo) { S.geo = null; $('clubList').innerHTML = clubListHtml(); el.setAttribute('aria-pressed', 'false'); break; }
        if (!navigator.geolocation) { toast('Platstjänster stöds inte i den här webbläsaren.'); return; }
        el.textContent = 'Hämtar plats…';
        navigator.geolocation.getCurrentPosition(function (pos) {
          S.geo = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          el.textContent = 'Nära mig'; el.setAttribute('aria-pressed', 'true');
          if ($('clubList')) $('clubList').innerHTML = clubListHtml();
        }, function () { el.textContent = 'Nära mig'; toast('Tillåt platsåtkomst för att se klubbar nära dig.'); }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 });
        break;
      }
      case 'club-filter': {
        S.clubFilter = S.clubFilter === el.dataset.v ? null : el.dataset.v;
        Array.prototype.forEach.call(document.querySelectorAll('[data-act="club-filter"]'), function (x) { x.setAttribute('aria-pressed', x.dataset.v === S.clubFilter); });
        $('clubList').innerHTML = clubListHtml();
        break;
      }
      case 'onlyfree': S.onlyFree = !S.onlyFree; renderBoka(); break;

      case 'confirm-book': {
        if (!draft || !needOnline()) return;
        el.disabled = true; el.textContent = 'Bokar…';
        var gs = []; for (var g = 2; g <= draft.players; g++) { var v = ($('g' + g) || {}).value; if (v && v.trim()) gs.push(v.trim()); }
        var r = await sb.rpc('book_tee_time', { p_course: draft.course, p_date: draft.date, p_time: draft.time, p_players: draft.players, p_guests: gs, p_open: $('openGroup') ? $('openGroup').checked : false });
        if (r.error) { el.disabled = false; el.textContent = 'Bekräfta bokning'; toast(errMsg(r.error)); if (/slot_full/.test(r.error.message)) { closeSheet(); loadSheet(true); } return; }
        if (draft.watchId) await sb.from('watches').delete().eq('id', draft.watchId);
        openDone(r.data); loadRounds().then(function () { renderMine(); saveCache(); }); loadSheet(true); loadWatches().then(renderWatch);
        break;
      }
      case 'share-done': copyText(inviteText(openDone.round), 'Inbjudan kopierad'); break;
      case 'win': {
        watchDraft.window = +el.dataset.v;
        Array.prototype.forEach.call($('winSeg').children, function (x) { x.setAttribute('aria-pressed', x === el); });
        $('winNote').textContent = winText(watchDraft.window); break;
      }
      case 'save-watch': {
        if (!needOnline()) return;
        el.disabled = true;
        var wantPush = $('wPush') && $('wPush').checked;
        var w = await sb.from('watches').insert({ club_id: S.club, course_id: S.course === 'any' ? null : S.course, play_date: S.date, tee_time: S.time, window_min: watchDraft.window, players: S.players });
        if (w.error) { el.disabled = false; toast(errMsg(w.error)); return; }
        closeSheet(); toast('Bevakningen är startad');
        if (wantPush) await enablePush(true);
        await loadWatches(); renderWatch(); renderBoka(); saveCache(); setTab('bevaka');
        break;
      }
      case 'unwatch': { if (!needOnline()) return; await sb.from('watches').delete().eq('id', id); S.watches = S.watches.filter(function (x) { return x.id !== id; }); renderWatch(); renderBoka(); toast('Bevakningen är borttagen'); break; }
      case 'book-watch': {
        var ww = S.watches.filter(function (x) { return x.id === id; })[0]; if (!ww || !ww.ready_slot) return;
        if (S.picks.indexOf(ww.club_id) < 0) { S.picks.push(ww.club_id); savePicks(); }

/* ================= Inloggning ================= */
var authMode = 'in';
function showAuth() { $('authView').hidden = false; $('appView').hidden = true; $('nav').hidden = true; $('actionbar').hidden = true; }
function showApp() { $('authView').hidden = true; $('appView').hidden = false; $('nav').hidden = false; }
function setAuthMode(m) {
  authMode = m;
  Array.prototype.forEach.call($('authSeg').children, function (b) { b.setAttribute('aria-pressed', b.dataset.mode === m); });
  $('nameField').hidden = m !== 'up'; $('authBtn').textContent = m === 'up' ? 'Skapa konto' : 'Logga in';
  $('aPw').autocomplete = m === 'up' ? 'new-password' : 'current-password'; $('authMsg').textContent = '';
}
async function onAuthSubmit(e) {
  e.preventDefault();
  var email = $('aEmail').value.trim(), pw = $('aPw').value, msg = $('authMsg'), btn = $('authBtn');
  if (!/^\S+@\S+\.\S+$/.test(email)) { msg.textContent = 'Skriv en giltig e-postadress.'; return; }
  if (pw.length < 8) { msg.textContent = 'Lösenordet måste vara minst 8 tecken.'; return; }
  btn.disabled = true; msg.textContent = '';
  try {
    if (authMode === 'up') {
      var name = $('aName').value.trim(); if (!name) { msg.textContent = 'Skriv ditt namn.'; return; }
      var r = await sb.auth.signUp({ email: email, password: pw, options: { data: { name: name }, emailRedirectTo: APP_URL } });
      if (r.error) throw r.error;
      if (!r.data.session) msg.textContent = 'Klart! Bekräfta din e-post via länken vi skickade, och logga sedan in.';
    } else {
      var s = await sb.auth.signInWithPassword({ email: email, password: pw });
      if (s.error) throw s.error;
    }
  } catch (err) { msg.textContent = errMsg(err); }
  finally { btn.disabled = false; }
}
async function onForgot() {
  var email = $('aEmail').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) { $('authMsg').textContent = 'Skriv din e-post först, tryck sedan Glömt lösenordet igen.'; return; }
  var r = await sb.auth.resetPasswordForEmail(email, { redirectTo: APP_URL });
  $('authMsg').textContent = r.error ? errMsg(r.error) : 'Vi har skickat en länk för att välja nytt lösenord.';
}
async function signOut() {
  try { if (pushState() === 'on') await disablePush(); } catch (e) {}
  if (chMain) sb.removeChannel(chMain); if (chSheet) sb.removeChannel(chSheet); chMain = chSheet = null;
  lsDel(cacheKey());
  await sb.auth.signOut();
}

async function startApp(session) {
  S.session = session; S.uid = session.user.id; S.email = session.user.email || '';
  showApp();
  var hadCache = loadCache();
  try { S.picks = JSON.parse(lsGet('tt-picks-' + S.uid) || '[]') || []; } catch (e) { S.picks = []; }
  var lt = lsGet('tt-tab'); if (lt) S.tab = lt;
  var hs = location.hash.replace('#', ''); if (['boka', 'mina', 'vanner', 'bevaka', 'mer'].indexOf(hs) >= 0) { S.tab = hs; history.replaceState(null, '', APP_URL + location.search); }
  setTab(S.tab);
  if (hadCache) renderAll();
  if (S.settings.default_players) S.players = S.settings.default_players;
  await refreshAll();
  if (S.settings.default_players && !S.booted) { S.players = S.settings.default_players; renderBoka(); }
  subscribeMain();
  S.booted = true;
  // Länk för att bli vän: ?add=KOD
  var add = new URLSearchParams(location.search).get('add');
  if (add) {
    history.replaceState(null, '', APP_URL);
    if (add.toUpperCase() !== S.profile.friend_code) {
      var r = await sb.rpc('send_friend_request', { p_code: add });
      toast(r.error ? errMsg(r.error) : 'Vänförfrågan skickad'); loadFriends().then(renderFriends); setTab('vanner');
    }
  }
}

  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'fDate' && t.value) { S.date = t.value < today() ? today() : t.value; S.scrollToSel = true; loadSheet(); renderBoka(); }
    else if (t.id === 'fTime' && t.value) { var target = toMin(t.value), best = S.time; sheetTimes().forEach(function (x) { if (Math.abs(toMin(x) - target) < Math.abs(toMin(best) - target)) best = x; }); S.time = best; S.scrollToSel = true; renderBoka(); }
    else if (t.id === 'clubCounty') { S.county = t.value; $('clubList').innerHTML = clubListHtml(); }

    else if (t.id === 'stEmail' || t.id === 'stRemind') {
      var patch = {}; patch[t.id === 'stEmail' ? 'notify_email' : 'remind_day_before'] = t.checked;
      sb.from('settings').update(patch).eq('user_id', S.uid).then(function (r) { if (r.error) { toast(errMsg(r.error)); t.checked = !t.checked; } else { Object.assign(S.settings, patch); saveCache(); toast('Sparat'); } });
    }
    else if (t.id === 'stBig') { lsSet('tt-big', t.checked ? '1' : '0'); applyLook(); }
    else if (t.id === 'admDate' && t.value) { S.adminDate = t.value; loadAdminDay().then(renderAdmin); }
    else if (t.closest && t.closest('#propFriends')) { var on = document.querySelectorAll('#propFriends input:checked'); if (on.length > 3) { t.checked = false; toast('Högst tre vänner per förslag.'); } }
  });
  var searchTimer = null;
  document.addEventListener('input', function (e) {

      clearTimeout(searchTimer);

        }).join('') : '<p class="note">Ingen spelare med det namnet.</p>';

  });
  $('sheet').addEventListener('click', function (e) { if (e.target === this) closeSheet(); });

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
    navigator.serviceWorker.addEventListener('message', function (e) { if (e.data && e.data.type === 'open') { loadNotifs().then(function () { renderBell(); openNotifs(); }); } });
  }

  sb.auth.onAuthStateChange(function (event, session) {
    if (event === 'PASSWORD_RECOVERY') {
      showApp();
      openSheet('<h2 id="sheetH">Välj nytt lösenord</h2><div class="field"><label for="newPw">Nytt lösenord (minst 8 tecken)</label><input type="password" id="newPw" autocomplete="new-password"></div><button type="button" class="btn primary" data-act="acc-pw-save">Spara lösenord</button>');
    }
    if (session && (!S.uid || S.uid !== session.user.id)) { setTimeout(function () { startApp(session); }, 0); }
    else if (!session) { S.uid = null; S.booted = false; showAuth(); }
  });
  sb.auth.getSession().then(function (r) { if (!r.data.session) showAuth(); });
}
boot();
})();
</script>
</body>
</html>
